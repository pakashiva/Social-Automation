{% extends "base.html" %}

{% block content %}

<div class="page-header">

    <div class="eyebrow">
        Content Planning
    </div>

    <h1>Content Calendar</h1>

    <p class="lead">
        View and manage your scheduled content in one place.
    </p>

</div>


<div class="calendar-page">

    <!-- Calendar -->
    <section class="calendar-card">

        <div id="content-calendar"></div>

    </section>

</div>


<!-- =========================================================
     FullCalendar
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const calendarElement =
        document.getElementById("content-calendar");


    /*
     * ---------------------------------------------------------
     * Temporary events
     * ---------------------------------------------------------
     *
     * These will later come from your Flask API / ContentJob
     * table.
     *
     */

    const events = [

        {
            id: "1",
            title: "AI in Customer Support",
            start: "2026-08-17T14:00:00",
            extendedProps: {
                platform: "LinkedIn",
                status: "Scheduled",
                pillar: "AI & Technology"
            }
        },

        {
            id: "2",
            title: "Customer Success Story",
            start: "2026-08-19T10:00:00",
            extendedProps: {
                platform: "Facebook",
                status: "Draft",
                pillar: "Customer Stories"
            }
        },

        {
            id: "3",
            title: "Product Update",
            start: "2026-08-21T14:00:00",
            extendedProps: {
                platform: "Instagram",
                status: "Scheduled",
                pillar: "Company Updates"
            }
        },

        {
            id: "4",
            title: "AI Automation Trends",
            start: "2026-08-24T11:00:00",
            extendedProps: {
                platform: "LinkedIn",
                status: "Scheduled",
                pillar: "AI & Technology"
            }
        }

    ];


    /*
     * ---------------------------------------------------------
     * Create Calendar
     * ---------------------------------------------------------
     */

    const calendar =
        new FullCalendar.Calendar(
            calendarElement,
            {

                /*
                 * Default view
                 */
                initialView: "dayGridMonth",


                /*
                 * Calendar header
                 */
                headerToolbar: {

                    left: "prev,next today",

                    center: "title",

                    right:
                        "dayGridMonth,timeGridWeek,timeGridDay"

                },


                /*
                 * Calendar height
                 */
                height: "auto",


                /*
                 * Show event time
                 */
                displayEventTime: true,


                /*
                 * Allow events to be clicked
                 */
                eventClick: function (info) {

                    const event =
                        info.event;

                    const platform =
                        event.extendedProps.platform;

                    const status =
                        event.extendedProps.status;

                    const pillar =
                        event.extendedProps.pillar;


                    /*
                     * Temporary behavior.
                     *
                     * Later this can open your content
                     * editing/viewing page or modal.
                     */

                    alert(
                        "Topic: " +
                        event.title +
                        "\n\n" +

                        "Date: " +
                        event.start.toLocaleDateString() +
                        "\n" +

                        "Time: " +
                        event.start.toLocaleTimeString(
                            [],
                            {
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        ) +
                        "\n\n" +

                        "Platform: " +
                        platform +
                        "\n" +

                        "Pillar: " +
                        pillar +
                        "\n" +

                        "Status: " +
                        status
                    );

                },


                /*
                 * Events
                 */
                events: events

            }
        );


    /*
     * Render calendar
     */

    calendar.render();

});

</script>


<style>

/* =========================================================
   Content Calendar
   ========================================================= */

.calendar-page {
    width: 100%;
}


.calendar-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
}


/* =========================================================
   FullCalendar overrides
   ========================================================= */

#content-calendar {

    width: 100%;

    font-family:
        var(--font-sans);

}


/* Calendar header */

.fc .fc-toolbar {

    margin-bottom: var(--space-5);

}


.fc .fc-toolbar-title {

    font-family:
        var(--font-serif);

    font-size: 1.6rem;

    font-weight: 600;

    color:
        var(--color-ink);

}


/* Buttons */

.fc .fc-button {

    background:
        var(--color-primary);

    border:
        1px solid var(--color-primary);

    border-radius:
        var(--radius-sm);

    font-family:
        var(--font-sans);

    font-size:
        0.85rem;

    font-weight:
        600;

    box-shadow:
        none;

}


.fc .fc-button:hover {

    background:
        var(--color-primary-strong);

    border-color:
        var(--color-primary-strong);

}


.fc .fc-button:focus {

    box-shadow:
        none;

}


.fc .fc-button-active {

    background:
        var(--color-primary-strong) !important;

    border-color:
        var(--color-primary-strong) !important;

}


/* Calendar cells */

.fc .fc-daygrid-day {

    min-height: 120px;

}


.fc .fc-daygrid-day-number {

    color:
        var(--color-ink);

    font-weight:
        600;

    padding:
        var(--space-2);

}


/* Today */

.fc .fc-day-today {

    background:
        var(--color-surface-muted) !important;

}


/* Events */

.fc .fc-event {

    border:
        none;

    border-radius:
        var(--radius-sm);

    padding:
        3px 6px;

    cursor:
        pointer;

    font-size:
        0.78rem;

    font-weight:
        600;

}


/* Week / Day time slots */

.fc .fc-timegrid-slot {

    height:
        3.5rem;

}


/* Weekday headings */

.fc .fc-col-header-cell-cushion {

    color:
        var(--color-muted);

    font-size:
        0.78rem;

    font-weight:
        700;

    text-transform:
        uppercase;

    letter-spacing:
        0.04em;

}


/* Remove unnecessary focus outline */

.fc a {

    text-decoration:
        none;

}


/* =========================================================
   Responsive
   ========================================================= */

@media (max-width: 768px) {

    .calendar-card {

        padding:
            var(--space-3);

    }


    .fc .fc-toolbar {

        flex-direction:
            column;

        gap:
            var(--space-3);

    }


    .fc .fc-toolbar-chunk {

        display:
            flex;

        justify-content:
            center;

    }


    .fc .fc-toolbar-title {

        font-size:
            1.3rem;

    }


    .fc .fc-daygrid-day {

        min-height:
            90px;

    }

}

</style>

{% endblock %}
