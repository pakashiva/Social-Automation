{% extends 'base.html' %}

{% block content %}

<div class="auth-page">
    <div class="auth-container">

        <form class="form-card" method="POST" action="{{ url_for('login') }}">

            <div class="auth-title">
                <p class="eyebrow">Welcome back</p>
                <h1>Login</h1>
            </div>

            <p class="auth-subtitle">
                Sign in to continue to your publishing workspace.
            </p>

            <div class="field-group">
                <label for="email">Email</label>
                <span class="field-help">Use the email address associated with your account.</span>
                <input id="email" type="email" name="email" autocomplete="email" required>
            </div>

            <div class="field-group">
                <label for="password">Password</label>
                <span class="field-help">Enter your account password.</span>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
            </div>

            <div class="form-actions">
                <button class="button button--primary button--block" type="submit">
                    Login
                </button>
            </div>

            <div class="auth-footer">
                Don't have an account?
                <a href="/signup">Create one</a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
