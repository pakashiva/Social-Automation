<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="mall-nav" th:fragment="nav">
    <a th:href="@{/}">Home</a>
    <a th:href="@{/shops}">Shops</a>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/categories}">Categories</a>
    <a th:href="@{/offers}">Offers</a>
    <a th:href="@{/contact}">Contact</a>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
    <a sec:authorize="isAnonymous()" th:href="@{/register}">Register</a>
    <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/customer/dashboard}">Dashboard</a>
    <a sec:authorize="hasRole('SHOP_OWNER')" th:href="@{/owner/dashboard}">Dashboard</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}">Dashboard</a>
</nav>
</body>
</html>
