<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Login</title></head>
<body>
<section layout:fragment="content">
<h1>Login</h1>

<form th:action="@{/login}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <label>Email <input class="form-control" name="username" type="email" required/></label>
  <label>Password <input class="form-control" name="password" type="password" required/></label>
  <button class="btn btn-mall" type="submit">Sign in</button>
</form>
<p><a th:href="@{/forgot-password}">Forgot password</a></p>

</section>
</body>
</html>
