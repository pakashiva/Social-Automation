<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Reset password</title></head>
<body>
<section layout:fragment="content">
<h1>Reset password</h1>

<p th:if="${!tokenValid}">This reset link is not valid.</p>
<form th:if="${tokenValid}" th:action="@{/reset-password}" th:object="${form}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <input type="hidden" th:field="*{token}"/>
  <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger"><p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p></div>
  <label>New password <input th:field="*{password}" type="password"/></label>
  <label>Confirm <input th:field="*{confirmPassword}" type="password"/></label>
  <button class="btn btn-mall" type="submit">Update password</button>
</form>

</section>
</body>
</html>
