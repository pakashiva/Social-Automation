<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Offers</title></head>
<body>
<section layout:fragment="content">
<h1>Offers</h1>

<div th:if="${#lists.isEmpty(offers)}" th:replace="~{fragments/empty-state :: empty('No offers are running.', @{/products}, 'Products')}"></div>
<article class="mall-card" th:each="offer : ${offers}">
  <h2 th:text="${offer.code}">CODE</h2>
  <p th:text="${offer.description}"></p>
  <p th:text="${offer.discountLabel}"></p>
  <p th:text="'Minimum ' + ${offer.minimum}"></p>
  <p th:text="'Ends ' + ${offer.endsAt}"></p>
  <p th:text="${offer.scopeLabel}"></p>
</article>

</section>
</body>
</html>
