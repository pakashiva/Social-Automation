<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Contact</title></head>
<body>
<section layout:fragment="content">
<h1>Contact</h1>

<form th:action="@{/contact}" th:object="${form}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger"><p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p></div>
  <label>Name <input th:field="*{guestName}"/></label>
  <label>Email <input th:field="*{guestEmail}" type="email"/></label>
  <label>Subject <input th:field="*{subject}"/></label>
  <label>Message <textarea th:field="*{message}"></textarea></label>
  <button class="btn btn-mall" type="submit">Send</button>
</form>

</section>
</body>
</html>
