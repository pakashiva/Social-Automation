<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout}">
<head><title>Product</title></head>
<body>
<section layout:fragment="content">
<h1>Product</h1>

<img th:src="${product.imageUrl}" alt="" width="220"/>
<p th:text="${product.shopName}"></p>
<p th:text="${product.description}"></p>
<p th:text="${product.priceLabel}"></p>
<p th:text="'In stock: ' + ${product.stock}"></p>
<form sec:authorize="hasRole('CUSTOMER')" th:action="@{/customer/cart/items}" method="post" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <input type="hidden" name="productId" th:value="${product.id}"/>
  <input class="form-control" name="quantity" value="1" type="number" min="1" max="20"/>
  <button class="btn btn-mall" type="submit">Add to cart</button>
</form>
<form sec:authorize="hasRole('CUSTOMER')" th:action="@{/customer/wishlist/items}" method="post" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <input type="hidden" name="productId" th:value="${product.id}"/>
  <button class="btn btn-outline-secondary" type="submit">Save to wishlist</button>
</form>

</section>
</body>
</html>
