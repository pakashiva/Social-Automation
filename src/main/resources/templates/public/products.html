<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Products</title></head>
<body>
<section layout:fragment="content">
<h1>Products</h1>

<form method="get" th:action="@{/products}" class="row g-2 mb-3">
  <div class="col-md-6"><input class="form-control" name="q" th:value="${q}" placeholder="Search"/></div>
  <div class="col-md-3"><button class="btn btn-mall" type="submit">Search</button></div>
</form>
<div th:if="${products.empty}" th:replace="~{fragments/empty-state :: empty('No products match.', @{/products}, 'All products')}"></div>
<div class="mall-grid">
  <article class="mall-card" th:each="product : ${products.content}">
    <img th:src="${product.imageUrl}" alt=""/>
    <h2><a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">Product</a></h2>
    <p th:text="${product.shopName}"></p>
    <p th:text="${product.priceLabel}"></p>
  </article>
</div>
<nav th:replace="~{fragments/pagination :: pager(${products})}"></nav>

</section>
</body>
</html>
