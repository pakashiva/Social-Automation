<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Shops</title></head>
<body>
<section layout:fragment="content">
<h1>Shops</h1>

<div th:if="${shops.empty}" th:replace="~{fragments/empty-state :: empty('No shops are open.', @{/}, 'Home')}"></div>
<div class="mall-grid">
  <article class="mall-card" th:each="shop : ${shops.content}">
    <img th:src="${shop.logoUrl}" alt=""/>
    <h2><a th:href="@{/shops/{slug}(slug=${shop.slug})}" th:text="${shop.name}">Shop</a></h2>
    <p th:text="${shop.floorLabel} + ' ' + ${shop.unitNumber}"></p>
  </article>
</div>
<nav th:replace="~{fragments/pagination :: pager(${shops})}"></nav>

</section>
</body>
</html>
