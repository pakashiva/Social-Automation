<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Register</title></head>
<body>
<section layout:fragment="content">
<h1>Register</h1>

<form th:action="@{/register}" th:object="${form}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger"><p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p></div>
  <label>Account <select th:field="*{accountType}"><option value="CUSTOMER">Customer</option><option value="SHOP_OWNER">Shop owner</option></select></label>
  <label>Name <input th:field="*{fullName}"/></label>
  <label>Email <input th:field="*{email}" type="email"/></label>
  <label>Mobile <input th:field="*{mobile}"/></label>
  <label>Password <input th:field="*{password}" type="password"/></label>
  <label>Confirm <input th:field="*{confirmPassword}" type="password"/></label>
  <fieldset>
    <legend>Shop owner</legend>
    <label>Business <input th:field="*{businessName}"/></label>
    <label>GST <input th:field="*{gstNumber}"/></label>
    <label>Shop <input th:field="*{shopName}"/></label>
    <label>Floor <input th:field="*{floorLabel}"/></label>
    <label>Unit <input th:field="*{unitNumber}"/></label>
    <label>Shop phone <input th:field="*{shopPhone}"/></label>
    <label>Opens <input th:field="*{openingTime}" type="time"/></label>
    <label>Closes <input th:field="*{closingTime}" type="time"/></label>
  </fieldset>
  <button class="btn btn-mall" type="submit">Create account</button>
</form>

</section>
</body>
</html>
