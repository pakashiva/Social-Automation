<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Attendance</title></head>
<body>
<section layout:fragment="content">
<h1>Attendance</h1>

<form method="get"><input type="date" name="date" th:value="${date}"/><button type="submit">Show</button></form>
<table class="table">
  <tr th:each="row : ${rows}">
    <td th:text="${row.employeeName}"></td>
    <td th:text="${row.status}"></td>
    <td>
      <form th:action="@{/admin/attendance}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="employeeId" th:value="${row.employeeId}"/>
        <input type="date" name="workDate" th:value="${date}" required/>
        <select name="status"><option>PRESENT</option><option>ABSENT</option><option>LEAVE</option><option>HALF_DAY</option></select>
        <input type="time" name="checkIn"/>
        <input type="time" name="checkOut"/>
        <input name="note"/>
        <button type="submit">Save</button>
      </form>
    </td>
  </tr>
</table>

</section>
</body>
</html>
