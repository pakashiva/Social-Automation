<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Salaries</title></head>
<body>
<section layout:fragment="content">
<h1>Salaries</h1>

<form th:action="@{/admin/salaries/generate}" th:object="${form}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <label>Month <input th:field="*{yearMonth}" placeholder="YYYY-MM"/></label>
  <button type="submit">Generate</button>
</form>
<table class="table">
  <tr th:each="row : ${salaries.content}">
    <td th:text="${row.employeeName}"></td><td th:text="${row.yearMonth}"></td><td th:text="${row.netAmount}"></td><td th:text="${row.status}"></td>
    <td><form th:if="${row.status == 'DRAFT'}" th:action="@{/admin/salaries/{id}/pay(id=${row.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit">Mark paid</button></form></td>
  </tr>
</table>

</section>
</body>
</html>
