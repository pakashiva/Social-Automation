<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Complaint</title></head>
<body>
<section layout:fragment="content">
<h1>Complaint</h1>

<p th:text="${complaint.complaintNumber}"></p>
<p th:text="${complaint.customerName}"></p>
<p th:text="${complaint.description}"></p>
<form th:action="@{/admin/complaints/{n}/assign(n=${complaint.complaintNumber})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input name="assigneeId" type="number"/><button type="submit">Assign</button></form>
<form th:action="@{/admin/complaints/{n}/resolve(n=${complaint.complaintNumber})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><textarea name="resolutionNote" minlength="10"></textarea><button type="submit">Resolve</button></form>
<form th:action="@{/admin/complaints/{n}/reject(n=${complaint.complaintNumber})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><textarea name="resolutionNote" minlength="10"></textarea><button type="submit">Reject</button></form>

</section>
</body>
</html>
