<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Notifications</title></head>
<body>
<section layout:fragment="content">
<h1>Notifications</h1>

<form th:action="@{/admin/notifications}" th:object="${form}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <label>Audience <select th:field="*{audience}"><option th:each="a : ${T(com.shoppingmall.enums.NotificationAudience).values()}" th:value="${a}" th:text="${a}"></option></select></label>
  <label>User id <input th:field="*{userId}"/></label>
  <label>Title <input th:field="*{title}"/></label>
  <label>Body <textarea th:field="*{body}"></textarea></label>
  <button type="submit">Send</button>
</form>
<article th:each="note : ${notifications.content}">
  <h2 th:text="${note.title}"></h2>
  <p th:text="${note.userEmail}"></p>
  <form th:action="@{/admin/notifications/{id}/read(id=${note.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit">Mark read</button></form>
</article>

</section>
</body>
</html>
