<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Add coupon</title></head>
<body>
<section layout:fragment="content">
<h1>Add coupon</h1>

<form th:action="@{/admin/coupons}" th:object="${form}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger"><p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p></div>
  <label>Scope <select th:field="*{scope}"><option value="MALL">MALL</option><option value="SHOP">SHOP</option><option value="CATEGORY">CATEGORY</option></select></label>
  <label>Shop <select th:field="*{shopId}"><option value="">—</option><option th:each="shop : ${choices.shops}" th:value="${shop.id}" th:text="${shop.name}"></option></select></label>
  <label>Category <select th:field="*{categoryId}"><option value="">—</option><option th:each="category : ${choices.categories}" th:value="${category.id}" th:text="${category.name}"></option></select></label>
  <label>Code <input th:field="*{code}"/></label>
  <label>Description <input th:field="*{description}"/></label>
  <label>Type <select th:field="*{discountType}"><option value="PERCENT">PERCENT</option><option value="FIXED">FIXED</option></select></label>
  <label>Value <input th:field="*{discountValue}"/></label>
  <label>Minimum <input th:field="*{minOrderAmount}"/></label>
  <label>Max <input th:field="*{maxDiscountAmount}"/></label>
  <label>Usage limit <input th:field="*{usageLimit}"/></label>
  <label>Per customer <input th:field="*{perCustomerLimit}"/></label>
  <label>Starts <input th:field="*{startsAt}" type="datetime-local"/></label>
  <label>Ends <input th:field="*{endsAt}" type="datetime-local"/></label>
  <button type="submit">Save coupon</button>
</form>

</section>
</body>
</html>
