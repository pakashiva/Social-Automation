<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Roles</title></head>
<body>
<section layout:fragment="content">
<h1>Roles</h1>

<article th:each="role : ${roles}">
  <h2 th:text="${role.name}"></h2>
  <p th:text="${role.description}"></p>
  <p th:text="'Users: ' + ${role.users}"></p>
  <ul><li th:each="line : ${role.permissions}" th:text="${line}"></li></ul>
</article>

</section>
</body>
</html>
