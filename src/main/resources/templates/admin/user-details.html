<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>User</title></head>
<body>
<section layout:fragment="content">
<h1>User</h1>

<p th:text="${user.fullName}"></p>
<p th:text="${user.email}"></p>
<p th:text="${user.role} + ' · ' + ${user.status}"></p>
<p th:text="${user.businessName}"></p>
<form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <select name="status"><option>ACTIVE</option><option>INACTIVE</option></select>
  <button type="submit">Update status</button>
</form>

</section>
</body>
</html>
