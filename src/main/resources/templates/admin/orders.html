<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Orders</title></head>
<body>
<section layout:fragment="content">
<h1>Orders</h1>

<table class="table"><tr th:each="order : ${orders.content}"><td><a th:href="@{/admin/orders/{n}(n=${order.orderNumber})}" th:text="${order.orderNumber}"></a></td><td th:text="${order.status}"></td><td th:text="${order.total}"></td></tr></table>

</section>
</body>
</html>
