<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Settings</title></head>
<body>
<section layout:fragment="content">
<h1>Settings</h1>

<form th:action="@{/admin/settings}" th:object="${form}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger"><p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p></div>
  <label>Mall name <input th:field="*{mallName}"/></label>
  <label>Default tax <input th:field="*{defaultTaxPercent}"/></label>
  <label>Low stock <input th:field="*{lowStockThreshold}" type="number"/></label>
  <label>Max upload <input th:field="*{maxUploadBytes}" type="number"/></label>
  <label>Support email <input th:field="*{supportEmail}"/></label>
  <label>Support phone <input th:field="*{supportPhone}"/></label>
  <button type="submit">Save settings</button>
</form>

</section>
</body>
</html>
