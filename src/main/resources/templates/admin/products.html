<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Catalog</title></head>
<body>
<section layout:fragment="content">
<h1>Catalog</h1>

<table class="table">
  <tr th:each="product : ${products.content}">
    <td th:text="${product.name}"></td><td th:text="${product.sku}"></td><td th:text="${product.status}"></td>
    <td><form th:action="@{/admin/products/{id}/archive(id=${product.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit">Archive</button></form></td>
  </tr>
</table>

</section>
</body>
</html>
