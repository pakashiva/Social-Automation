<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Coupons</title></head>
<body>
<section layout:fragment="content">
<h1>Coupons</h1>

<p><a th:href="@{/admin/coupons/new}">Add coupon</a></p>
<table class="table"><tr th:each="coupon : ${coupons.content}"><td th:text="${coupon.code}"></td><td th:text="${coupon.scopeLabel}"></td><td th:text="${coupon.active}"></td><td><form th:action="@{/admin/coupons/{id}/deactivate(id=${coupon.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit">Deactivate</button></form></td></tr></table>

</section>
</body>
</html>
