<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Shop review</title></head>
<body>
<section layout:fragment="content">
<h1>Shop review</h1>

<h2 th:text="${shop.name}"></h2>
<p th:text="${shop.businessName}"></p>
<p th:text="${shop.status} + ' · ' + ${shop.approvalStatus}"></p>
<form th:action="@{/admin/shops/{id}/approve(id=${shop.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit">Approve</button></form>
<form th:action="@{/admin/shops/{id}/reject(id=${shop.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><textarea name="rejectionReason" required minlength="10"></textarea><button type="submit">Reject</button></form>
<form th:action="@{/admin/shops/{id}/status(id=${shop.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><select name="status"><option>ACTIVE</option><option>SUSPENDED</option><option>CLOSED</option><option>DRAFT</option></select><button type="submit">Change status</button></form>

</section>
</body>
</html>
