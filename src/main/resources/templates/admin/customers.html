<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Customers</title></head>
<body>
<section layout:fragment="content">
<h1>Customers</h1>

<form method="get"><input name="q" th:value="${q}"/><button type="submit">Search</button></form>
<table class="table"><tr th:each="customer : ${customers.content}"><td th:text="${customer.fullName}"></td><td th:text="${customer.email}"></td><td th:text="${customer.address}"></td></tr></table>
<h2>Feedback</h2>
<article th:each="row : ${feedback.content}">
  <p th:text="${row.fromName} + ' · ' + ${row.subject} + ' · ' + ${row.status}"></p>
  <form th:action="@{/admin/feedback/{id}/status(id=${row.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><select name="status"><option>OPEN</option><option>REVIEWED</option><option>CLOSED</option></select><button type="submit">Update</button></form>
</article>

</section>
</body>
</html>
