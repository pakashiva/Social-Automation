<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Order</title></head>
<body>
<section layout:fragment="content">
<h1>Order</h1>

<p th:text="${order.orderNumber} + ' · ' + ${order.customerName} + ' · ' + ${order.status}"></p>
<form th:if="${order.adminCancelAllowed}" th:action="@{/admin/orders/{n}/cancel(n=${order.orderNumber})}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <input name="cancelReason" required minlength="5"/>
  <button type="submit" data-confirm="Cancel this order?">Cancel</button>
</form>

</section>
</body>
</html>
