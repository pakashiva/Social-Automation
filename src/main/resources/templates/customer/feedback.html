<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Feedback</title></head>
<body>
<section layout:fragment="content">
<h1>Feedback</h1>

<form th:action="@{/customer/feedback}" th:object="${form}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger"><p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p></div>
  <label>Subject <input th:field="*{subject}"/></label>
  <label>Message <textarea th:field="*{message}"></textarea></label>
  <label>Rating <input th:field="*{rating}" type="number" min="1" max="5"/></label>
  <button class="btn btn-mall" type="submit">Send feedback</button>
</form>
<table class="table"><tr th:each="row : ${feedback.content}"><td th:text="${row.subject}"></td><td th:text="${row.status}"></td><td th:text="${row.rating}"></td></tr></table>

</section>
</body>
</html>
