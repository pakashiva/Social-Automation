<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Notifications</title></head>
<body>
<section layout:fragment="content">
<h1>Notifications</h1>

<div th:if="${notifications.empty}" th:replace="~{fragments/empty-state :: empty('No notifications.', @{/customer/dashboard}, 'Dashboard')}"></div>
<article th:each="note : ${notifications.content}">
  <h2 th:text="${note.title}"></h2>
  <p th:text="${note.body}"></p>
  <a th:if="${note.linkPath != null}" th:href="${note.linkPath}">Open</a>
  <form th:if="${note.unread}" th:action="@{/customer/notifications/{id}/read(id=${note.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit">Mark read</button></form>
</article>

</section>
</body>
</html>
