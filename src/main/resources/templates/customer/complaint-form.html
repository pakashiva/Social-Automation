<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>New complaint</title></head>
<body>
<section layout:fragment="content">
<h1>New complaint</h1>

<form th:action="@{/customer/complaints}" th:object="${form}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger"><p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p></div>
  <label>Category <select th:field="*{category}"><option th:each="c : ${T(com.shoppingmall.enums.ComplaintCategory).values()}" th:value="${c}" th:text="${c}"></option></select></label>
  <label>Subject <input th:field="*{subject}"/></label>
  <label>Description <textarea th:field="*{description}"></textarea></label>
  <label>Order number <input th:field="*{orderNumber}"/></label>
  <label>Shop id <input th:field="*{shopId}"/></label>
  <button class="btn btn-mall" type="submit">Submit</button>
</form>

</section>
</body>
</html>
