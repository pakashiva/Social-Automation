<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Cart</title></head>
<body>
<section layout:fragment="content">
<h1>Cart</h1>

<div th:if="${#lists.isEmpty(cart.lines)}" th:replace="~{fragments/empty-state :: empty('Your cart is empty.', @{/products}, 'Browse products')}"></div>
<table class="table" th:if="${!#lists.isEmpty(cart.lines)}">
  <tr th:each="line : ${cart.lines}">
    <td th:text="${line.productName}"></td>
    <td th:text="${line.shopName}"></td>
    <td th:text="${line.unitPrice}"></td>
    <td>
      <form th:action="@{/customer/cart/items/{id}(id=${line.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input name="quantity" type="number" min="1" max="20" th:value="${line.quantity}"/>
        <button type="submit">Update</button>
      </form>
    </td>
    <td th:text="${line.lineTotal}"></td>
    <td>
      <form th:action="@{/customer/cart/items/{id}/delete(id=${line.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Remove</button>
      </form>
    </td>
  </tr>
</table>
<p th:if="${!#lists.isEmpty(cart.lines)}" th:text="'Subtotal ' + ${cart.subtotal} + ' · Tax ' + ${cart.tax} + ' · Total ' + ${cart.total}"></p>
<p th:if="${!#lists.isEmpty(cart.lines)}"><a class="btn btn-mall" th:href="@{/customer/checkout}">Checkout</a></p>

</section>
</body>
</html>
