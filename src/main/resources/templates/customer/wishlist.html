<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Wishlist</title></head>
<body>
<section layout:fragment="content">
<h1>Wishlist</h1>

<div th:if="${#lists.isEmpty(items)}" th:replace="~{fragments/empty-state :: empty('Your wishlist is empty.', @{/products}, 'Browse products')}"></div>
<article th:each="item : ${items}">
  <img th:src="${item.imageUrl}" alt="" width="80"/>
  <a th:href="@{/products/{id}(id=${item.productId})}" th:text="${item.productName}"></a>
  <span th:text="${item.priceLabel}"></span>
  <form th:action="@{/customer/wishlist/items/{id}/move(id=${item.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit">Move to cart</button></form>
  <form th:action="@{/customer/wishlist/items/{id}/delete(id=${item.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit">Remove</button></form>
</article>

</section>
</body>
</html>
