<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Orders</title></head>
<body>
<section layout:fragment="content">
<h1>Orders</h1>

<div th:if="${orders.empty}" th:replace="~{fragments/empty-state :: empty('You have not placed an order yet.', @{/products}, 'Browse products')}"></div>
<table class="table" th:if="${!orders.empty}">
  <tr th:each="order : ${orders.content}">
    <td><a th:href="@{/customer/orders/{n}(n=${order.orderNumber})}" th:text="${order.orderNumber}"></a></td>
    <td th:text="${order.shopName}"></td>
    <td th:text="${order.status}"></td>
    <td th:text="${order.total}"></td>
  </tr>
</table>
<nav th:replace="~{fragments/pagination :: pager(${orders})}"></nav>

</section>
</body>
</html>
