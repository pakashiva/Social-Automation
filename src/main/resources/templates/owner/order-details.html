<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Shop order</title></head>
<body>
<section layout:fragment="content">
<h1>Shop order</h1>

<p th:text="${order.orderNumber} + ' · ' + ${order.status}"></p>
<table class="table"><tr th:each="line : ${order.lines}"><td th:text="${line.productName}"></td><td th:text="${line.quantity}"></td></tr></table>
<form th:each="next : ${order.nextStatuses}" th:action="@{/owner/orders/{n}/status(n=${order.orderNumber})}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <input type="hidden" name="status" th:value="${next}"/>
  <button type="submit" th:text="'Mark ' + ${next}"></button>
</form>
<form th:if="${order.ownerCancelAllowed}" th:action="@{/owner/orders/{n}/cancel(n=${order.orderNumber})}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <input name="cancelReason" required minlength="5"/>
  <button type="submit" data-confirm="Cancel this order?">Cancel</button>
</form>

</section>
</body>
</html>
