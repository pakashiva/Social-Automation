<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Edit product</title></head>
<body>
<section layout:fragment="content">
<h1>Edit product</h1>

<p th:text="${product.sku}"></p>
<form th:action="@{/owner/products/{id}(id=${product.id})}" th:object="${form}" method="post" enctype="multipart/form-data">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <input type="hidden" th:field="*{shopId}"/>
  <input type="hidden" th:field="*{sku}"/>
  <label>Category <select th:field="*{categoryId}"><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select></label>
  <label>Name <input th:field="*{name}"/></label>
  <label>Description <textarea th:field="*{description}"></textarea></label>
  <label>Price <input th:field="*{unitPrice}"/></label>
  <label>Compare at <input th:field="*{compareAtPrice}"/></label>
  <label>Tax % <input th:field="*{taxRatePercent}"/></label>
  <label>Status <select th:field="*{status}"><option th:each="s : ${T(com.shoppingmall.enums.ProductStatus).values()}" th:value="${s}" th:text="${s}"></option></select></label>
  <input type="file" name="image" data-preview="#image-name"/>
  <span id="image-name"></span>
  <button type="submit">Save product</button>
</form>

</section>
</body>
</html>
