<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Owner dashboard</title></head>
<body>
<section layout:fragment="content">
<h1>Owner dashboard</h1>

<ul><li th:each="entry : ${dashboard.counts}" th:text="${entry.key} + ': ' + ${entry.value}"></li></ul>
<canvas id="ownerSales"></canvas>
<script th:inline="javascript">document.addEventListener('DOMContentLoaded', function () { drawChart('ownerSales', /*[[@{/owner/reports/sales.json}]]*/ '', 'line'); });</script>

</section>
</body>
</html>
