<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Offers</title></head>
<body>
<section layout:fragment="content">
<h1>Offers</h1>

<p><a th:href="@{/owner/offers/new}">Add offer</a></p>
<table class="table">
  <tr th:each="offer : ${offers.content}">
    <td th:text="${offer.code}"></td><td th:text="${offer.discountLabel}"></td><td th:text="${offer.active}"></td>
    <td><form th:action="@{/owner/offers/{id}/deactivate(id=${offer.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit">Deactivate</button></form></td>
  </tr>
</table>

</section>
</body>
</html>
