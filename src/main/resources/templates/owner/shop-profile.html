<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Shop profile</title></head>
<body>
<section layout:fragment="content">
<h1>Shop profile</h1>

<article th:each="shop : ${shops}">
  <h2 th:text="${shop.name}"></h2>
  <p th:text="${shop.status}"></p>
  <img th:src="${shop.logoUrl}" alt="" width="120"/>
  <form th:action="@{/owner/shop-profile/{id}(id=${shop.id})}" method="post" enctype="multipart/form-data">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>Description <textarea name="description" th:text="${shop.description}"></textarea></label>
    <label>Phone <input name="contactPhone" th:value="${shop.phone}"/></label>
    <label>Opens <input name="openingTime" type="time" required th:value="${shop.openingTime}"/></label>
    <label>Closes <input name="closingTime" type="time" required th:value="${shop.closingTime}"/></label>
    <input type="file" name="logo" accept="image/jpeg,image/png,image/webp" data-preview="#logo-name"/>
    <span id="logo-name"></span>
    <button type="submit">Save shop</button>
  </form>
</article>

</section>
</body>
</html>
