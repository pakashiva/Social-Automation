<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Add offer</title></head>
<body>
<section layout:fragment="content">
<h1>Add offer</h1>

<form th:action="@{/owner/offers}" th:object="${form}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger"><p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p></div>
  <label>Shop <select th:field="*{shopId}"><option th:each="shop : ${shops}" th:value="${shop.id}" th:text="${shop.name}"></option></select></label>
  <input type="hidden" name="scope" value="SHOP"/>
  <label>Code <input th:field="*{code}"/></label>
  <label>Description <input th:field="*{description}"/></label>
  <label>Type <select th:field="*{discountType}"><option value="PERCENT">PERCENT</option><option value="FIXED">FIXED</option></select></label>
  <label>Value <input th:field="*{discountValue}"/></label>
  <label>Minimum <input th:field="*{minOrderAmount}" value="0.00"/></label>
  <label>Max discount <input th:field="*{maxDiscountAmount}"/></label>
  <label>Usage limit <input th:field="*{usageLimit}"/></label>
  <label>Per customer <input th:field="*{perCustomerLimit}" value="1"/></label>
  <label>Starts <input th:field="*{startsAt}" type="datetime-local"/></label>
  <label>Ends <input th:field="*{endsAt}" type="datetime-local"/></label>
  <button type="submit">Save offer</button>
</form>

</section>
</body>
</html>
